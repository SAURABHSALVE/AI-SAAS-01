name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Placeholder values only — the build imports server modules that
    # instantiate DB/auth/AI clients at module load time, so these just
    # need to be present and well-formed, never real credentials.
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/meet_ai
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_STREAM_VIDEO_API_KEY: ci-placeholder
      STREAM_VIDEO_SECRET_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
      AGENT_SERVICE_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ PASS — build and tests succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ FAIL — build or tests failed" >> "$GITHUB_STEP_SUMMARY"
          fi
